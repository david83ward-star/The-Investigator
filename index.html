<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Investigator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="title-screen" class="screen active">
  <h1>THE INVESTIGATOR</h1>
  <p>Metropolitan Police Casework System</p>
  <button onclick="showCharacterScreen()">New Game</button>
  <button onclick="continueGame()">Continue</button>
</section>

<section id="character-screen" class="screen">
  <div class="window login-window">
    <div class="window-title">New Starter Login</div>
    <label>Name</label>
    <input id="player-name" placeholder="DC Ward" />
    <button onclick="startGame()">Enter System</button>
  </div>
</section>

<section id="desktop-screen" class="screen">
  <div class="taskbar">
    <span>SECURE CASEWORK TERMINAL</span>
    <span id="officer-name"></span>
  </div>

  <div class="desktop">
    <div class="desktop-icon" onclick="openInbox()">✉<br><span>Inbox</span></div>
    <div class="desktop-icon" onclick="openCaseFile()">📁<br><span>Case File</span></div>
    <div class="desktop-icon" onclick="openPNC()">⌕<br><span>PNC</span></div>
    <div class="desktop-icon" onclick="openEvidence()">▣<br><span>Evidence</span></div>

    <div class="window main-window">
      <div class="window-title">CASEWORK TERMINAL</div>
      <div id="main-window" class="window-content">
        <h2>Welcome</h2>
        <p>Select an item from the desktop.</p>
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
